<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サロゲートペア 結合テスト用ページ</title>
  <script src="https://d.shutto-translation.com/trans.js?id=83844"></script>
</head>
<body>
  <h1>破損サロゲート 結合テスト</h1>

  <!-- 孤立High(U+D83D) : aria-label -->
  <div id="c1" aria-label=""></div>
  <!-- 孤立Low(U+DC40)  : alt -->
  <img id="c2" src="dummy.jpg" alt="">
  <!-- 正常ペア(👀=U+1F440) : テキスト -->
  <p id="c3"></p>
  <!-- 3パターン混在 : テキスト -->
  <p id="c4"></p>
  <!-- 孤立High単体（サニタイズ後に空文字になる） : テキスト -->
  <p id="c5"></p>

  <script>
    const HIGH = "\uD83D";        // 高位のみ（破損）
    const LOW  = "\uDC40";        // 低位のみ（破損）
    const PAIR = "\uD83D\uDC40";  // 正常ペア（👀）

    document.getElementById('c1').setAttribute('aria-label', "うちわ絵付け体験 開催中" + HIGH);
    document.getElementById('c2').setAttribute('alt', LOW + "画像の説明テスト");
    document.getElementById('c3').innerText = "正常な絵文字テスト" + PAIR;
    document.getElementById('c4').innerText = "混在" + HIGH + "テスト" + LOW + "終わり" + PAIR;
    document.getElementById('c5').innerText = HIGH;  // 孤立High単体（除去後に空文字）
  </script>
</body>
</html>
